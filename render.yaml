services:
  - type: web
    name: qr-cafe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: unset GUNICORN_CMD_ARGS; flask --app run.py init-db && flask --app run.py seed-data && gunicorn --bind 0.0.0.0:${PORT:-10000} --worker-class gunicorn.workers.geventlet.EventletWorker -w 1 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: FLASK_CONFIG
        value: production
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: qr-cafe-db-v2
          property: connectionString
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: BROADCAST_SEND_WORKERS
        value: 8
      - key: WHATSAPP_CLOUD_API_VERSION
        value: v25.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BROADCAST_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: 91
      - key: WHATSAPP_ALLOW_FREEFORM_TEXT
        value: false

databases:
  - name: qr-cafe-db-v2
    plan: free
    databaseName: qrcafe
    user: qrcafe
